name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Build examples
        run: |
          for example in hello kitchen-sink; do
            (cd examples/$example && pnpm typecheck && pnpm build)
          done

  swift:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build TVMLReactExtras for tvOS
        run: xcodebuild -scheme TVMLReactExtras -destination 'generic/platform=tvOS Simulator' build
