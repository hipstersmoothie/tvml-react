name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Build examples
        run: |
          for example in hello kitchen-sink photos docs-gallery; do
            (cd examples/$example && pnpm typecheck && pnpm build)
          done
      - name: Docs site
        run: pnpm --filter tvml-react-site build
      - name: Starter (create-tvml-react)
        run: |
          node create/index.js "$RUNNER_TEMP/smoke-app"
          cd "$RUNNER_TEMP/smoke-app"
          sed -i "s#\"tvml-react\": \"[^\"]*\"#\"tvml-react\": \"link:$GITHUB_WORKSPACE\"#" package.json
          pnpm install --ignore-workspace
          pnpm typecheck && pnpm build

  swift:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build TVMLReactExtras for tvOS
        run: xcodebuild -scheme TVMLReactExtras -destination 'generic/platform=tvOS Simulator' build
